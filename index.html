<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>도형 머지</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-bg: #cdc1b4;
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 26px;
    color: var(--text-dark);
    margin: 0;
    font-weight: 800;
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board-bg);
    color: var(--text-light);
    border-radius: 8px;
    padding: 8px 14px;
    text-align: center;
    min-width: 60px;
  }
  .score-box .label { font-size: 11px; opacity: 0.8; }
  .score-box .value { font-size: 18px; font-weight: 700; }

  .icon-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .icon-btn {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    justify-content: center;
  }
  .icon-btn.muted { background: #a99a8d; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .desc { font-size: 12px; color: var(--text-dark); line-height: 1.4; }
  .new-game-btn {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .board-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    border-radius: 10px;
    padding: 10px;
    touch-action: none;
  }
  .grid-bg {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3%;
  }
  .grid-cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }
  .tiles-layer {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3%;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    color: var(--text-dark);
    transition: top 0.12s ease, left 0.12s ease, transform 0.1s ease;
  }
  .tile.spawn { animation: pop 0.18s ease; }
  .tile.merged { animation: pop 0.18s ease; }
  @keyframes pop {
    0% { transform: scale(0.5); }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.92);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h2 {
    font-size: 30px;
    color: var(--text-dark);
    margin: 0 0 10px;
  }
  .overlay p { color: var(--text-dark); margin: 0 0 14px; font-size: 15px; }
  .overlay-btns { display: flex; gap: 8px; }
  .overlay button {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .overlay button.secondary { background: #4a90d9; }

  .ranking-panel {
    margin-top: 14px;
    background: #fff;
    border: 1px solid #e8e2d8;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .ranking-panel h3 {
    margin: 0 0 8px;
    font-size: 14px;
    color: var(--text-dark);
  }
  .ranking-panel .note {
    font-size: 11px;
    color: #a99a8d;
    margin-bottom: 8px;
  }
  .rank-list { list-style: none; margin: 0; padding: 0; }
  .rank-list li {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
    color: var(--text-dark);
    border-bottom: 1px dashed #eee;
  }
  .rank-list li:last-child { border-bottom: none; }
  .rank-list .empty { color: #bbb; text-align: center; padding: 6px 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #3c3a32;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .footer {
    margin-top: 12px;
    text-align: center;
    color: var(--text-dark);
    font-size: 12px;
    opacity: 0.75;
  }
</style>

<body>
<div class="wrap">
  <div class="header">
    <h1>도형 머지</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">점수</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">최고</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="icon-bar">
    <button class="icon-btn" id="soundBtn">🔊 사운드</button>
    <button class="icon-btn" id="themeBtn">🎨 테마: 숫자</button>
    <button class="icon-btn" id="shareBtn">📤 공유</button>
  </div>

  <div class="toolbar">
    <div class="desc">같은 타일을 밀어서 합쳐보세요!<br>(스와이프 또는 방향키)</div>
    <button class="new-game-btn" id="newGameBtn">새 게임</button>
  </div>

  <div class="board-container" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">게임 오버</h2>
      <p id="overlayDesc">더 이상 움직일 칸이 없어요.</p>
      <div class="overlay-btns">
        <button id="overlayBtn">다시 하기</button>
        <button class="secondary" id="overlayShareBtn">공유하기</button>
      </div>
    </div>
  </div>

  <div class="ranking-panel">
    <h3>🏆 이번 세션 TOP 5</h3>
    <div class="note">* 브라우저를 새로고침하면 초기화됩니다. 기기별로 계속 남는 진짜 "일일 랭킹"을 원하시면 서버 연동이 필요해요.</div>
    <ul class="rank-list" id="rankList">
      <li class="empty">아직 기록이 없어요</li>
    </ul>
  </div>

  <div class="footer">스와이프 또는 방향키로 조작하세요</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const gridBgEl = document.getElementById('gridBg');
  const tilesLayerEl = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayEl = document.getElementById('overlay');
  const overlayTitleEl = document.getElementById('overlayTitle');
  const overlayDescEl = document.getElementById('overlayDesc');
  const overlayBtnEl = document.getElementById('overlayBtn');
  const overlayShareBtnEl = document.getElementById('overlayShareBtn');
  const newGameBtnEl = document.getElementById('newGameBtn');
  const soundBtnEl = document.getElementById('soundBtn');
  const themeBtnEl = document.getElementById('themeBtn');
  const shareBtnEl = document.getElementById('shareBtn');
  const rankListEl = document.getElementById('rankList');
  const toastEl = document.getElementById('toast');

  let grid = [];
  let score = 0;
  let best = 0;
  let tileIdCounter = 1;
  let hasWon = false;
  let soundOn = true;
  let themeIndex = 0; // 0: 숫자, 1: 과일, 2: 동물
  let sessionScores = []; // 세션 동안의 TOP 5. 실제 배포 시 localStorage로 바꾸면 기기별 영구 기록이 됩니다.
  let gameEnded = false;

  const THEMES = [
    { name: '숫자', map: null },
    { name: '과일', map: { 2: '🍒', 4: '🍇', 8: '🍊', 16: '🍋', 32: '🍎', 64: '🍏', 128: '🍍', 256: '🥝', 512: '🍑', 1024: '🍉', 2048: '👑' } },
    { name: '동물', map: { 2: '🐣', 4: '🐤', 8: '🐥', 16: '🐰', 32: '🐱', 64: '🐶', 128: '🦊', 256: '🐼', 512: '🦁', 1024: '🐯', 2048: '🐉' } }
  ];

  const colorMap = {
    2: '#ffe0b2',
    4: '#ffcc80',
    8: '#ffa726',
    16: '#fb8c00',
    32: '#f4511e',
    64: '#e53935',
    128: '#fdd835',
    256: '#fbc02d',
    512: '#f9a825',
    1024: '#f57f17',
    2048: '#ff6f00'
  };
  const textColorLight = new Set([16,32,64,128,256,512,1024,2048]);

  // ---------- 사운드 (Web Audio API로 합성음 생성, 외부 파일 불필요) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, duration, type, gainValue) {
    if (!soundOn) return;
    try {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(gainValue || 0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* 오디오 미지원 환경 무시 */ }
  }
  function sfxMove() { beep(220, 0.06, 'sine', 0.06); }

  // 합쳐진 값이 클수록 화음이 풍성해지고 강렬해짐
  function sfxMerge(value, comboIndex) {
    const base = 220 + Math.min(value, 2048) * 0.25;
    const intensity = Math.min(1, value / 512); // 값이 클수록 1에 가까워짐
    const comboBoost = 1 + (comboIndex || 0) * 0.08; // 콤보마다 음이 계단식 상승

    beep(base * comboBoost, 0.16, 'triangle', 0.12 + intensity * 0.08);
    if (value >= 32) {
      // 5도 화음 추가로 소리를 풍성하게
      beep(base * 1.5 * comboBoost, 0.14, 'sine', 0.08 + intensity * 0.06);
    }
    if (value >= 128) {
      // 옥타브 위 화음까지 더해 더 웅장하게
      beep(base * 2 * comboBoost, 0.12, 'triangle', 0.07 + intensity * 0.05);
    }
    if (value >= 512) {
      // 저음 펀치 추가로 임팩트 강화
      beep(base * 0.5, 0.2, 'sawtooth', 0.1 + intensity * 0.06);
    }
  }

  function sfxNewTile() { beep(500, 0.05, 'sine', 0.05); }

  // 보드가 꽉 차갈 때 울리는 경고음 (빈 칸이 적을수록 빠르고 급박하게)
  let warningTimer = null;
  function sfxWarningBeat(emptyCount) {
    clearTimeout(warningTimer);
    if (emptyCount > 2 || emptyCount < 0) return;
    const urgency = emptyCount === 0 ? 3 : emptyCount === 1 ? 2 : 1;
    beep(150, 0.09, 'square', 0.09 + urgency * 0.02);
  }

  function sfxGameOver() {
    // 묵직하고 드라마틱한 하강 스팅어
    beep(400, 0.22, 'sawtooth', 0.14);
    setTimeout(() => beep(300, 0.22, 'sawtooth', 0.14), 130);
    setTimeout(() => beep(200, 0.25, 'sawtooth', 0.15), 260);
    setTimeout(() => beep(120, 0.5, 'sawtooth', 0.16), 400);
    setTimeout(() => beep(80, 0.6, 'sine', 0.12), 420);
  }

  function sfxWin() {
    // 더 화려한 팡파레 (화음 + 상승 아르페지오)
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((f, i) => {
      setTimeout(() => {
        beep(f, 0.22, 'sine', 0.11);
        beep(f * 1.5, 0.18, 'triangle', 0.06);
      }, i * 85);
    });
    setTimeout(() => beep(1568, 0.4, 'sine', 0.14), notes.length * 85 + 60);
  }

  // ---------- 토스트 ----------
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ---------- 그리드 로직 ----------
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    gridBgEl.appendChild(cell);
  }

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function randomEmptyCell() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) empties.push({ r, c });
    if (empties.length === 0) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function addRandomTile() {
    const pos = randomEmptyCell();
    if (!pos) return;
    const value = Math.random() < 0.9 ? 2 : 4;
    grid[pos.r][pos.c] = { id: tileIdCounter++, value, row: pos.r, col: pos.c, isNew: true, merged: false };
    sfxNewTile();
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    hasWon = false;
    gameEnded = false;
    scoreEl.textContent = '0';
    overlayEl.classList.remove('show');
    addRandomTile();
    addRandomTile();
    render();
  }

  function cellPercent(index) {
    return index * (100 / SIZE);
  }

  function render() {
    tilesLayerEl.innerHTML = '';
    const theme = THEMES[themeIndex];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        if (t.isNew) el.classList.add('spawn');
        if (t.merged) el.classList.add('merged');
        const sizePct = 100 / SIZE;
        el.style.width = `calc(${sizePct}% - 3%)`;
        el.style.height = `calc(${sizePct}% - 3%)`;
        el.style.left = `${cellPercent(c)}%`;
        el.style.top = `${cellPercent(r)}%`;
        el.style.marginLeft = `calc(${c} * 3% / ${SIZE})`;
        el.style.marginTop = `calc(${r} * 3% / ${SIZE})`;
        const bg = colorMap[t.value] || '#3c3a32';
        el.style.background = bg;
        el.style.color = '#000000';

        if (theme.map) {
          el.textContent = theme.map[t.value] || '⭐';
          el.style.fontSize = '30px';
        } else {
          el.textContent = t.value;
          const fontSize = t.value >= 1000 ? '20px' : t.value >= 100 ? '24px' : '30px';
          el.style.fontSize = fontSize;
        }
        tilesLayerEl.appendChild(el);
        t.isNew = false;
        t.merged = false;
      }
    }
  }

  function cloneGridValues() {
    return grid.map(row => row.map(cell => (cell ? cell.value : null)));
  }

  function gridsEqual(a, b) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (a[r][c] !== b[r][c]) return false;
    return true;
  }

  function moveLine(line) {
    const filtered = line.filter(t => t !== null);
    const merged = [];
    let gained = 0;
    let mergedAnyValue = 0;
    for (let i = 0; i < filtered.length; i++) {
      if (i < filtered.length - 1 && filtered[i].value === filtered[i + 1].value && !filtered[i].mergedFlag && !filtered[i + 1].mergedFlag) {
        const newValue = filtered[i].value * 2;
        merged.push({ id: filtered[i].id, value: newValue, merged: true, isNew: false });
        gained += newValue;
        mergedAnyValue = newValue;
        filtered[i + 1].mergedFlag = true;
        i++;
      } else if (!filtered[i].mergedFlag) {
        merged.push({ id: filtered[i].id, value: filtered[i].value, merged: false, isNew: false });
      }
    }
    while (merged.length < SIZE) merged.push(null);
    return { line: merged, gained, mergedAnyValue };
  }

  function move(direction) {
    const before = cloneGridValues();
    let totalGained = 0;
    let mergeCount = 0;
    let lastMergedValue = 0;

    if (direction === 'left' || direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        let line = grid[r].slice();
        if (direction === 'right') line.reverse();
        const result = moveLine(line);
        if (direction === 'right') result.line.reverse();
        for (let c = 0; c < SIZE; c++) {
          const t = result.line[c];
          grid[r][c] = t ? { id: t.id, value: t.value, row: r, col: c, merged: t.merged, isNew: t.isNew } : null;
        }
        totalGained += result.gained;
        if (result.gained > 0) { mergeCount++; lastMergedValue = result.mergedAnyValue; }
      }
    } else {
      for (let c = 0; c < SIZE; c++) {
        let line = [];
        for (let r = 0; r < SIZE; r++) line.push(grid[r][c]);
        if (direction === 'down') line.reverse();
        const result = moveLine(line);
        if (direction === 'down') result.line.reverse();
        for (let r = 0; r < SIZE; r++) {
          const t = result.line[r];
          grid[r][c] = t ? { id: t.id, value: t.value, row: r, col: c, merged: t.merged, isNew: t.isNew } : null;
        }
        totalGained += result.gained;
        if (result.gained > 0) { mergeCount++; lastMergedValue = result.mergedAnyValue; }
      }
    }

    const after = cloneGridValues();
    if (!gridsEqual(before, after)) {
      score += totalGained;
      scoreEl.textContent = String(score);
      if (score > best) {
        best = score;
        bestEl.textContent = String(best);
      }
      if (mergeCount > 0) sfxMerge(lastMergedValue, mergeCount - 1); else sfxMove();
      addRandomTile();
      render();
      checkGameState();

      const emptyCount = countEmptyCells();
      if (emptyCount <= 2) sfxWarningBeat(emptyCount);
    }
  }

  function countEmptyCells() {
    let count = 0;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) count++;
    return count;
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c].value;
        if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].value === v) return true;
        if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function checkGameState() {
    if (!hasWon) {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] && grid[r][c].value >= 2048) {
            hasWon = true;
            sfxWin();
            overlayTitleEl.textContent = '2048 달성! 🎉';
            overlayDescEl.textContent = '축하합니다! 계속 진행하거나 새 게임을 시작하세요.';
            overlayEl.classList.add('show');
            overlayBtnEl.textContent = '계속하기';
            overlayBtnEl.onclick = () => { overlayEl.classList.remove('show'); };
            return;
          }
    }
    if (!canMove() && !gameEnded) {
      gameEnded = true;
      sfxGameOver();
      overlayTitleEl.textContent = '게임 오버';
      overlayDescEl.textContent = `최종 점수: ${score}점`;
      overlayBtnEl.textContent = '다시 하기';
      overlayBtnEl.onclick = startGame;
      overlayEl.classList.add('show');
      recordScore(score);
    }
  }

  // ---------- 세션 랭킹 ----------
  // 실제 배포 시 아래 두 함수를 localStorage 기반으로 바꾸면 기기별로 기록이 계속 남습니다.
  // 예: localStorage.setItem('scores', JSON.stringify(sessionScores));
  function recordScore(finalScore) {
    if (finalScore <= 0) return;
    sessionScores.push({ score: finalScore, time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) });
    sessionScores.sort((a, b) => b.score - a.score);
    sessionScores = sessionScores.slice(0, 5);
    renderRanking();
  }
  function renderRanking() {
    if (sessionScores.length === 0) {
      rankListEl.innerHTML = '<li class="empty">아직 기록이 없어요</li>';
      return;
    }
    rankListEl.innerHTML = sessionScores
      .map((s, i) => `<li><span>${i + 1}위</span><span>${s.score}점 · ${s.time}</span></li>`)
      .join('');
  }

  // ---------- 공유 ----------
  function shareScore() {
    const text = `도형 머지 게임에서 ${score}점을 기록했어요! 당신도 도전해보세요 🧩`;
    if (navigator.share) {
      navigator.share({ title: '도형 머지', text, url: window.location.href }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(`${text} ${window.location.href}`).then(() => {
        showToast('점수가 클립보드에 복사되었어요!');
      }).catch(() => {
        showToast('공유를 지원하지 않는 환경이에요.');
      });
    } else {
      showToast('공유를 지원하지 않는 환경이에요.');
    }
  }

  // ---------- 테마 ----------
  function cycleTheme() {
    themeIndex = (themeIndex + 1) % THEMES.length;
    themeBtnEl.textContent = `🎨 테마: ${THEMES[themeIndex].name}`;
    render();
  }

  // ---------- 사운드 토글 ----------
  function toggleSound() {
    soundOn = !soundOn;
    soundBtnEl.textContent = soundOn ? '🔊 사운드' : '🔇 사운드';
    soundBtnEl.classList.toggle('muted', !soundOn);
    if (soundOn) { ensureAudio(); beep(440, 0.08, 'sine', 0.1); }
  }

  // ---------- 이벤트 ----------
  window.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  let touchStartX = 0, touchStartY = 0;
  let touchTracking = false;
  const SWIPE_THRESHOLD = 24;

  boardEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchTracking = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  boardEl.addEventListener('touchend', (e) => {
    if (!touchTracking) return;
    touchTracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < SWIPE_THRESHOLD) return;
    if (absDx > absDy) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  newGameBtnEl.addEventListener('click', startGame);
  soundBtnEl.addEventListener('click', toggleSound);
  themeBtnEl.addEventListener('click', cycleTheme);
  shareBtnEl.addEventListener('click', shareScore);
  overlayShareBtnEl.addEventListener('click', shareScore);

  startGame();
  renderRanking();
})();
</script>
</body>
</html>
